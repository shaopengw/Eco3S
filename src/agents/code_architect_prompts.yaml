generate_influence_pairs_prompt: |
  你将根据项目的设计文档与模块配置，推断该模拟环境下“客观环境/系统状态之间的多跳因果链条”。
  只捕捉自然条件、基础设施、资源供给、经济指标等可量化变量之间的传导，不允许出现任何需要决策的主观选择。

  【核心要求】
  1. 连通性：因果网络应当是一个连通图（以模块为节点、影响关系为边），任意两个模块之间存在路径，严禁出现孤立节点或互不相交的子图。
  2. 结构偏好：优先提取设计文档中的显式因果链路，保留级联（A→B→C）和反馈环（A→B→A）；优先选择跨模块的间接影响与双向反馈，而非多个独立的直接影响对。
  3. 覆盖性：网络应覆盖所有核心模块之间的主要传导路径，确保每个模块至少参与一条连接（不成为仅出现一次的孤立叶子节点）。
  4. 总量控制：影响对数量通常不超过 15 条；网络完整性优先于数量限制。

  【信息优先级】
  设计文档是因果网络构建的首要依据，权重最高；模块配置次之；论文库检索结果仅供参考，用于验证或补充设计文档未覆盖的客观传导关系。

  【生成策略】
  1. 先提取设计文档中的主干因果链（最核心的 3-5 条跨模块传导路径），确保骨架完整。
  2. 再围绕主干补充必要的分支和反馈连接，形成网络。
  3. 最后才参考论文库中的补充关系，且只采纳与设计文档方向一致、能强化主干网络的证据，无关或次要论文证据直接忽略。

  示例（仅示意，不可抄写）：
  - 极端气候 → 运河通航能力下降 → 相关就业减少

  【设计文档】
  {description_md}

  【模块配置】
  {modules_config_yaml}

  【论文库检索参考】
  {paper_candidates_context}

  # 若上方提供了参考影响对，请优先考虑或验证这些客观传导关系，但不要直接抄写无关项。

  输出 JSON 数组；每个元素描述一条客观影响链中的一环。
  格式示例（仅示意，不可抄写）：
  ```json
  [
    {{
      "pair_id": 1,
      "cause": {{"module": "climate", "param": "climate stability"}},
      "effect": {{"module": "transport_economy", "param": "canal navigability"}},
      "direction": "increase",
      "effect_size": "moderate"
    }}
  ]
  ```

  约束：
  1. pair_id 递增且唯一。
  2. 重要：module 名必须使用模块配置中存在的名称，不得自行编造，param 用英文短语描述“客观可测的状态/指标”。
  3. direction 仅取 increase/decrease，effect_size 用定性短语（如 moderately、drastically）。
  4. 严禁将主观行为列入 cause/effect，可描述其客观前因。
  5. 只返回 JSON，不要解释或注释。

resolve_influence_pair_params_prompt: |
  根据模块接口文件，完善影响对。

  【当前影响对】
  {pair_json}

  【cause 模块接口文件】
  {cause_interface_docs}

  【effect 模块接口文件】
  {effect_interface_docs}

  任务：
  1. 属性名严格匹配：将 cause.param 和 effect.param 替换为对应接口文件 中实际存在的属性名，必须严格一致。
  2. 无合适匹配时：保留最接近的可识别名称，在 rationale 中说明"未找到严格匹配的属性，已标记 TODO"。
  3. 不要修改其他内容，特殊情况可附加 `rationale`字段。

  输出：严格 JSON 数组，结构与输入一致，不要解释。

enrich_influence_pairs_prompt: |
  根据给出初步的影响对列表与基于参数描述检索到的上下文，重新评估初步影响对的 direction 与 effect_size。

  【初步影响对】
  {pairs_json}

  【RAG 检索上下文】
  {rag_context}
  # 上下文包含：直接证据（向量检索 causal_claims）、相关影响对（相同 cause/effect）、调节/中介变量论文。

  任务：只更新 direction/effect_size；数值优先，严禁纯定性词。
    effect_size 的优先级：
    a. 如果上下文中提供了具体数值、百分比或公式，优先直接采用。
    b. 否则使用基于证据的合理估算数值（如 0.12、"8%"、"0.3 * base"）。
    c. 严禁使用纯定性词（如 moderate、slightly、significant、high、low）。
    若上下文中有相关影响对或调节变量信息，可在 rationale 中简要说明交互关系。

  输出：严格 JSON 数组，结构与输入一致。

generate_influence_block_prompt: |
  基于模拟影响对，生成一个可直接写入 influences.yaml 的 influence 块。
  只处理当前这一条 pair，不要输出顶层 execution_order，也不要输出 influences 列表外的解释文字。

  【当前影响对】
  {pair_json}

  【cause 模块代码】
  {cause_module_code}

  【effect 模块代码】
  {effect_module_code}

  【influences.yaml 模板参考】
  {template_content}

  任务：
  1. 结合当前 pair 的 cause/effect 信息和对应模块源码，生成这一条影响对应的单个 influence 块。
  2. 输出必须与 influences.yaml 的单条列表项结构兼容，至少包含 name/type/source/target/params。
  3. source 优先使用 cause 模块名或模块对象写法，target 依据 effect 模块及该 pair 的语义选择合适的目标名。
  4. 如果无法确定字段名，优先保守生成可解析的 YAML 块，不要编造不存在的属性。
  5. expr 必须是可执行的定量表达式（数值、Python 算术表达式、或引用其他模块属性的简单公式），严禁纯定性词（如 moderate、slightly、high、low）。
  6. 若 effect 的参数属于 Agent 主观决策/选择类（如 job selection、migration decision、consumer choice 等），该 influence 为**占位声明**，必须在 `params` 中写 `placeholder: true`，并在 description 中简要说明。

  输出格式：
  ```yaml
  name: example_name
  type: expr
  source:
    module: example_source
  target: example_target
  description: example description
  params:
    expr: example_expression
  ```

  只返回一个 YAML 代码块，不要输出其他内容。

# 生成提示词文件
generate_role_files_prompt: |
  根据设计文档生成{role_type}的相关配置文件。

  设计文档：
  {description_md}

  提示词模板参考：
  {template_content}
  
  {template_content_action}

  {agent_profile_attrs_doc}

  要求：
  1. 参照模板的结构与风格  
  2. 提示词与动作配置需详细、具体，符合角色特征，基于实验背景与目标定制，确保引导合理决策  
  3. 若提供动作模板参考，需同步生成对应的动作配置文件  
  4. 仅保留代码所需的提示词模块，删除无关模块  
  5. 只使用模板中已定义的变量（允许将Agent Profile属性作为{{属性名}}占位符），禁用未定义变量，并删除所有注释

  请生成完整的YAML格式文件，包括prompts/{role_type}.yaml，以及 actions/{role_type}.yaml 。
  两个文件内容需要相互对应，请使用以下格式分隔两个文件的内容：
  
  ```yaml
  # prompts/{role_type}.yaml
  ...
  ```
  
  ```yaml
  # actions/{role_type}.yaml
  ...
  ```

# 基于 influences.yaml 检查 simulator
check_simulator_with_influences_prompt: |
  根据 influences.yaml 双向检查 simulator 代码合规性：
  1. influences.yaml 中引用的所有状态/参数必须在 simulator 中有真实、有意义的定义或来源；
  2. simulator 中暴露/计算的所有影响相关字段必须在 influences.yaml 中有对应条目，避免单边声明。

  【influences.yaml】
  {influences_yaml}

  【simulator 代码】
  {simulator_content}

  检查项：
  1. 去重：删除 simulator 中与 influences.yaml 重复的状态更新硬编码逻辑。
  2. simulator_state 完整性：update_state 中构建的 simulator_state 须暴露 influences.yaml 所有 inputs/variables 所需字段。
  3. apply_all_influences 调用时机：确认其在 update_state 中被正确调用。
  4. 参数真实存在性：逐条检查 influences.yaml 中 source/inputs/variables/target_attr/expr/code 引用的字段，是否在 simulator 的 __init__、init_results、update_state、collect_results 或其他方法中有真实定义或可靠来源。
     - 如果某字段仅被引用但无定义，或对应 influence 的 description/params 包含 TODO/占位声明，必须使 simulator 与 influences.yaml 同步：要么在 simulator 中主动定义，要么从 influences.yaml 中删除/修正该条目。
     - 主动定义方式包括：在 __init__ 中初始化属性、在 init_results 中注册 results 键、在 update_state 中计算并写入 simulator_state、新增辅助计算方法/统计方法等。
     - 对于需要汇总/统计的字段（如总人口、失业率、军力等），设计合理的计算方法或统计方法。
  5. influences.yaml 一致性：如果 simulator 新增了影响相关字段，必须在 influences.yaml 中补充对应 influence；如果 influences.yaml 中存在 simulator 无法提供的字段，必须删除或修正该 influence。

  若无问题只返回：OK
  若有修改返回 JSON（influences_yaml 字段必须是完整的文件内容， simulator 字段只包含增量修改）：
  ```json
  {{
    "methods": [{{"method_name": "...", "method_code": "...", "description": "..."}}],
    "delete_methods": ["..."],
    "influences_yaml": "完整的 influences.yaml 内容（YAML字符串，保留原始缩进和格式）"
  }}
  ```

  注意：只返回最小必要修改，不要添加未在 influences.yaml 中使用的字段；influences.yaml 必须保持完整可解析的 YAML 格式。

# 运行时错误修复（增量修改版）
fix_runtime_errors_prompt: |
  程序运行出错，请修复。

  错误信息：
  {error_traceback}

  Main文件（{main_file_path}）：
  ```python
  {main_content}
  ```

  Simulator文件（{simulator_file_path}）：
  ```python
  {simulator_content}
  ```

  相关配置文件内容：
  {config_files_str}

  相关模块接口：
  {module_interface_docs}

  【任务】
  1. 分析错误堆栈，定位问题所在的文件和函数/方法
  2. 参考接口文件和配置文件，确保使用正确的方法名、参数和配置
  3. 尽可能以最小改动修复问题，可以修改代码、配置文件或提示词
  4. 只有当接口中没有可用的方法，且该功能必须实现，才尝试自己编写函数/方法
  5. 修复错误时优先解决根因，禁止通过添加裸 except Exception 掩盖错误；若必须使用 try/except，应捕获具体异常类型。

  【输出格式】
  根据需要修改的文件类型，返回对应的JSON块。Main文件用 # === MAIN FILE ===，Simulator文件用 # === SIMULATOR FILE ===，配置文件和提示词文件用 # === CONFIG FILES ===。

  ```json
  # === MAIN FILE ===
  {{
    "functions": [
      {{
        "function_name": "函数名（纯函数名，不含def等）",
        "function_code": "完整的函数代码（从def开始）",
        "description": "修改说明"
      }}
    ],
    "delete_functions": ["不需要的函数名1", "不需要的函数名2"]
  }}
  ```
  
  ```json
  # === SIMULATOR FILE ===
  {{
    "methods": [
      {{
        "method_name": "方法名（纯方法名，不含def等）",
        "method_code": "完整的方法代码（从def/async def开始）",
        "description": "修改说明"
      }}
    ],
    "delete_methods": ["不需要的方法名1", "不需要的方法名2"]
  }}
  ```

  ```json
  # === CONFIG FILES ===
  {{
    "config_files": [
      {{
        "file_name": "需要修改的配置文件名（例如：simulation_config.yaml）",
        "modifications": [
          {{
            "parameter": "参数名",
            "value": "新值"
          }}
        ]
      }}
    ]
  }}
  ```

  【特殊场景：配置文件语法错误】
  如果错误是 YAML/JSON 语法错误（如 ScannerError、YAMLError、JSONDecodeError），
  参数级增量修改无法工作（因为文件本身已无法解析）。此时请直接返回修正后的完整文件内容：

  ```yaml
  # === REWRITE FILE: jobs_config.yaml ===
  jobs_info:
    品牌商高管:
      base_salary: 150
  ```

  或对于JSON文件：

  ```json
  # === REWRITE FILE: towns_data.json ===
  {{
    "towns": [{{"name": "Town1"}}]
  }}
  ```

  注意：
  - delete_methods/delete_functions 是可选字段。
  - 只返回需要修改的文件的严格的JSON块或重写块，不要分析和说明。
  - 若错误在 src/agents/ 核心文件中且是 KeyError，优先通过修改 CONFIG FILES（提示词模板）移除不兼容占位符，不要反复修改 SIMULATOR。
  - 对于配置文件**语法错误**（如包含反引号、Markdown标记导致解析失败），必须使用 REWRITE FILE 模式返回完整修正内容，禁止使用 CONFIG FILES 增量修改模式。

