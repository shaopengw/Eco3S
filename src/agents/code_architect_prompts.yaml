#   2. 代码新增：根据设计文档，新增模板中没有但模拟器核心逻辑所必需的方法。这些新增方法应能体现设计文档中描述的关键操作或状态管理。
#   3. 框架引导： 对于依赖后续步骤完善的模块功能，请在主代码中用注释形式留下明确的TODO标识，并简要说明该部分需要什么模块数据或实现逻辑。
