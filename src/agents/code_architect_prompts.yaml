# 编码师Agent的提示词配置文件

system_message: "你是Python编码专家，擅长生成完整、可运行的模拟器代码、配置文件和提示词。代码简洁高效，严格遵循Python规范。"

# 新模块插件代码生成
customize_new_plugin_prompt: |
  你将编写插件 {plugin_name} 的完整 Python 源码，使其满足 notes 的要求。

  inherits_from：{inherits_from}
  notes：{notes}

  【设计文档】
  {description_md}

  【当前插件代码】
  {current_code}

  【base插件代码】
  {base_code}

  【硬约束】
  - 先输出一行：DESCRIPTION: <准确详细的插件描述>
  - 然后输出一个 ```python 代码块，内容为“完整文件源码”
  - 类名必须为 {plugin_class}，与当前插件代码中的类名保持一致
  - 保持文件可导入、可运行；不要输出解释
  - 尽可能使用当前插件代码和 base 代码中已有的 import，严禁凭空捏造不存在的 import

# 分析错误相关的模块和配置文件
analyze_error_modules_prompt: |
  分析以下错误信息，判断可能需要参考哪些接口文件或配置文件。

  错误堆栈：
  {error_traceback}

  可用的模块接口文件映射：
  {module_mapping}

  配置文件和提示词文件列表：
  {config_files_list}

  【任务】
  根据错误信息，判断需要参考哪些文档来修复问题，尽可能只找最相关的一个文件：
  1. 接口文件：模块接口和方法定义（.py文件）
  2. 配置文件：可能与错误相关的配置或提示词文件（.yaml/.json文件）

  【输出格式】
  返回JSON对象，包含两个数组：
  {{
    "api_docs": ["iclimate.py", "itime.py"],
    "config_files": ["simulation_config.yaml", "residents_prompts.yaml"]
  }}

  注意：如果某类文件没有相关的，对应数组为空。只返回JSON对象，不要其他解释。

generate_simulator_code_prompt: |
  【任务目标】
  根据设计文档，构建一个功能完备、结构清晰的模拟器主代码框架，为后续模块完善做好引导。

  【输入文件】
  --- BEGIN_DESIGN_DOC ---
  {description_md}
  --- END_DESIGN_DOC ---

  --- BEGIN_MODULES_CONFIG ---
  {modules_config_yaml}
  --- END_MODULES_CONFIG ---

  --- BEGIN_INFLUENCES_YAML ---
  {influences_yaml}
  --- END_INFLUENCES_YAML ---

  --- BEGIN_TEMPLATE_CODE ---
  {template_content}
  --- END_TEMPLATE_CODE ---

  【核心约束】
  1. **最小修改原则**：在模板基础上增量修改，保留无明确用途但可能被依赖的方法（标记TODO）；新增设计文档要求且模板缺失的核心方法。
  2. **TODO引导规范**：对于依赖后续步骤实现的功能，用TODO注释说明所需模块或逻辑。除此类必要TODO外，不添加其他注释。
  3. **数据一致性**：`init_results()` 中的每个键必须在 `__init__()` 中通过 `self.results[键].append(...)` 提供初始值，确保所有列表长度一致。
  4. **接口严格性**：只能调用 `src/interfaces/` 中定义的方法；若不存在，用TODO标记，不得自行编造。
  5. **影响函数集成**：
     - `update_state` 中构建的 `simulator_state` 必须暴露 `influences.yaml` 中所有 `inputs/variables` 字段。
     - 正确调用 `influence_manager.apply_all_influences(simulator_state)`。
     - 禁止在simulator中硬编码与 `influences.yaml` 重复的状态更新逻辑。
  6. **代码风格**：遵循Python最佳实践，保持风格一致，避免冗余代码。

  【严格禁止】
  - 添加任何 `import` 语句。
  - 删除或修改模板中已有的重要初始化语句。
  - 在非代码块中输出解释或说明。
  - 将Simulator类作为插件实现类，或直接复制插件接口中的方法。

  【输出格式】
  返回JSON，结构如下：
  ```json
  {{
    "methods": [{{"method_name": "方法名", "method_code": "完整代码（从def/async def开始）", "description": "修改说明"}}],
    "delete_methods": ["不需要的方法名1", "不需要的方法名2"]
  }}

# 生成模拟器主代码
# generate_simulator_code_prompt: |
#   【任务目标】
