#   - 禁止在 simulator 中硬编码特定年份（如 if year == 2016）或历史事件；时间敏感逻辑应通过配置注入。

#   【输出格式】
#   返回JSON格式，包含需要修改的内容。请确保JSON结构严格符合以下定义：

#   ```json
