#   【设计文档】
#   {description_md}
#   # 注意：仔细阅读设计文档，理解模拟器的核心功能、整体架构、数据流以及各个模块之间的交互。

#   【模块配置文件】
#   {modules_config_yaml}
#   # 注意：此文件定义了模拟器将要集成的各个功能模块。

#   【影响函数配置（influences.yaml）】
