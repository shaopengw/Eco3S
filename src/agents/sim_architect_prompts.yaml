# SimArchitectAgent 提示词配置

system_message: |
  你是多智能体模拟系统的设计师，擅长分析需求、选择模块、生成设计文档和实验配置。输出格式严格遵守JSON或YAML规范。

select_modules_prompt: |
  根据需求，从插件清单中挑选需要的模块。
  仅当关键能力不可缺少、没有任何相关插件且上述方式均无法实现时，才允许 new_modules 非空；能找到 inherits_from 就必须复用，不得新增。

  项目描述：
  {description_md_text}

  {plugins_catalog}

select_modules_with_feedback_prompt: |
  根据需求，从插件清单中挑选需要的模块。
  仅当关键能力不可缺少、没有任何相关插件且上述方式均无法实现时，才允许 new_modules 非空；能找到 inherits_from 就必须复用，不得新增。

  项目描述：
  {description_md_text}

  {plugins_catalog}

  上一版本选择的模块：
  {previous_modules}

  用户反馈意见：
  {user_feedback}

  请根据用户反馈调整模块选择。

select_modules_output_format: |
  只返回以下 JSON，不要解释：
  {{
    "selected_modules": [
      "模块/插件名1",
      "模块/插件名2"
    ],
    "new_modules": []
  }}
  selected_modules 只能填写清单中的准确名称；不满足新增条件时 new_modules 必须为 []。确需新增时：
  {{
    "name": "新模块名称",
    "inherits_from": null,
    "notes": "缺失的关键运行时能力，以及现有插件和其他扩展方式为什么都无法实现"
  }}

generate_description_prompt: |
  请根据以下需求信息，生成一份完整的实验设计文档（markdown格式）。
  注意：尽可能详细，涵盖所有关键部分。
  注意：直接输出文档正文，第一行必须是 # 开头的标题；不要输出任何前言、开场白、元评论或"写作风格"说明；不要把模板顶部的"写作风格"提示复制到输出中。

  用户原始需求:
  {original_requirement}

  系统解析后的需求：
  {requirement_dict}

  参考模板格式：
  {template_content}

generate_description_with_feedback_prompt: |
  请根据以下需求信息，生成一份完整的实验设计文档（markdown格式）。
  注意：尽可能详细，涵盖所有关键部分。
  注意：直接输出文档正文，第一行必须是 # 开头的标题；不要输出任何前言、开场白、元评论或"写作风格"说明；不要把模板顶部的"写作风格"提示复制到输出中。

  用户原始需求:
  {original_requirement}

  系统解析后的需求：
  {requirement_dict}

  参考模板格式：
  {template_content}

  === 上一版本的设计文档 ===
  {previous_description}

  === 用户反馈意见 ===
  {user_feedback}

  请根据用户反馈，改进并重新生成设计文档。

generate_description_requirements: |
  请按照模板格式生成新的实验设计文档，包含：
  1. 实验名称和目标
  2. 需要涉及的系统功能和模块
  3. 系统架构设计
  4. 预期结果
  5. 关键参数说明

generate_agent_profile_prompt: |
  请根据设计文档中「智能体与行为」的描述和模块配置，生成模拟中 Agent 的角色定义与画像配置。

  === 设计文档 - 智能体与行为 ===
  {agent_behavior_section}

  === 模块配置 ===
  {modules_config_yaml}

  === 运行时属性契约（从实体源码提取） ===
  {runtime_profile_contract}

  请严格遵循以下最小模板结构生成 YAML 配置：

  ```yaml
  agents:
    - name: <角色标识，如 consumer / enterprise / official>
      entity_type: baseagent    # baseagent | resident | government | rebels
      attributes:
        - name: <属性名>
          runtime_key: <稳定代码键，如 satisfaction；必须是 Python 标识符>
          type: choice          # choice：离散选择型
          choices: [<选项1>, <选项2>]
          weights: [<权重1>, <权重2>]
        # --- 或 ---
        - name: <属性名>
          type: range           # range：范围分布型
          distribution: uniform # 或 normal / weighted_groups
          min: <最小值>
          max: <最大值>
          dtype: int            # 或 float
          # normal 还需: mean: <均值>, std: <标准差>
        # --- 或 ---
        - name: <属性名>
          type: composite       # composite：词库组合型，从候选词列表中随机抽取若干词拼接
          words: [<候选词1>, <候选词2>, <候选词3>, ...]
          count: <抽取词数量>
          separator: <分隔符，如 "、">
      constraints:              # 使用 runtime_key 编写结构化约束（可选）
        - condition: <条件表达式>
          adjustments:
            <runtime_key>: {{set: <值>}}
      extra:                    # 静态属性，不参与随机生成
        role: <角色名>          # 用于 prompts/actions 文件命名
        # baseagent 如需自主决策并影响宏观状态，可配 decision_effectors
        # 示例：
        # decision_effectors:
        #   output_change: {{target: output_level, mode: relative_percent}}
        #   capacity_change: {{target: capacity_utilization, mode: absolute_points, scale: 0.01}}
  computed_descriptions:
    <分组名>:
      - "<描述文本>"
  ```

  要求：
  1. entity_type 选择规则（按匹配度优先）：
     - **baseagent（默认值）**：通用决策主体。如果角色不是明确的人类、政府或叛军，就使用此类型。例如 consumer、enterprise、farmer、merchant 等。
     - **resident**：明确的人类个体，具有就业、收入、健康、满意度、城镇生活等属性。
     - **government**：政府/统治主体，需要主动制定政策、征税、投资、管理公共事务。
     - **rebels**：叛军/反抗组织，需要主动进行反抗、煽动、组织行动。
     判断方法：如果角色描述中不包含 resident / government / rebels 的核心特征，一律使用 baseagent。
  2. 用 extra.role 区分具体角色名（如 consumer、enterprise、government_official 等）。
  3. composite 类型必须直接列出候选词（words），不要引用外部文件路径；候选词数量应不少于 count。
  4. 所有属性名称、取值范围必须与设计文档一致；每个属性必须同时声明唯一 runtime_key。name 可使用自然语言，代码、约束和 effects 只使用 runtime_key。
  5. baseagent 角色若需要 LLM 决策：在 extra 中声明 decision_effectors，字段名与 prompts/{{role}}.yaml 的 decision_json 返回字段一致；target 为画像属性名或 simulator.状态名；mode 可选 relative_percent / absolute_points / set / add；必要时用 scale 做单位转换。
  6. 直接输出严格 YAML 格式，不要加代码块标记或额外解释。

generate_agent_profile_with_feedback_prompt: |
  请根据设计文档中「智能体与行为」的描述、模块配置和用户反馈，重新生成或修正 Agent 的角色定义与画像配置。

  === 设计文档 - 智能体与行为 ===
  {agent_behavior_section}

  === 模块配置 ===
  {modules_config_yaml}

  === 上一版本的 Agent Profile ===
  {previous_agent_profile}

  === 用户反馈意见 ===
  {user_feedback}

  === 运行时属性契约（从实体源码提取） ===
  {runtime_profile_contract}

  请严格遵循以下最小模板结构生成 YAML 配置：

  ```yaml
  agents:
    - name: <角色标识>
      entity_type: baseagent    # baseagent | resident | government | rebels
      attributes:
        - name: <属性名>
          runtime_key: <稳定代码键；必须是 Python 标识符>
          type: choice | range | composite
          # choice: choices + weights
          # range: distribution + min + max + dtype
          # composite: words + count + separator
      constraints:
        - condition: <条件表达式>
          adjustments:
            <runtime_key>: {{set: <值>}}
      extra:
        role: <角色名>          # 用于 prompts/actions 文件命名
        # baseagent 如需自主决策并影响宏观状态，可配 decision_effectors
        # 示例：
        # decision_effectors:
        #   output_change: {{target: output_level, mode: relative_percent}}
        #   capacity_change: {{target: capacity_utilization, mode: absolute_points, scale: 0.01}}
  computed_descriptions:
    <属性值到自然语言描述的映射>
  ```

  要求：
  1. entity_type 选择规则（按匹配度优先）：
     - **baseagent（默认值）**：通用决策主体。只要角色不是明确的人类居民、政府或叛军，就使用此类型。
     - **resident**：明确的人类居民个体，具有就业、收入、健康、满意度、城镇生活等属性。
     - **government**：政府/统治主体，需要主动制定政策、征税、投资、管理公共事务。
     - **rebels**：叛军/反抗组织，需要主动进行反抗、煽动、组织行动。
     判断方法：如果角色描述中不包含 resident / government / rebels 的核心特征，一律使用 baseagent。
  2. 利用 extra.role 区分具体角色名。
  3. composite 类型必须直接列出候选词（words），不要引用外部文件路径；候选词数量应不少于 count。
  4. 根据用户反馈对上一版本进行修正，保持其他部分不变。
  5. 所有属性名称、取值范围必须与设计文档一致；每个属性必须声明唯一 runtime_key，代码、约束和 effects 只使用 runtime_key。
  6. baseagent 角色若需要 LLM 决策：在 extra 中声明 decision_effectors，字段名与 prompts/{{role}}.yaml 的 decision_json 返回字段一致；target 为画像属性名或 simulator.状态名；mode 可选 relative_percent / absolute_points / set / add；必要时用 scale 做单位转换。
  7. 输出严格 YAML 格式，直接返回 YAML 内容，不要加 ```yaml 代码块标记或额外解释。
