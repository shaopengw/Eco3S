# 真实数据指标注册表
# 供阶段 3.45 的 LLM 映射使用：LLM 根据 (module, param) 的描述语义，
# 从本注册表中选择最匹配的真实数据指标。

indicators:
  # ========== WDI 世界银行宏观指标 ==========
  - code: "NY_GDP_MKTP_CD"
    name: "GDP (current US$)"
    description: "现价美元计GDP，反映经济规模"

  - code: "NY_GDP_MKTP_KD_ZG"
    name: "GDP growth (annual %)"
    description: "年GDP增长率，反映经济扩张或收缩速度"

  - code: "NY_GDP_PCAP_CD"
    name: "GDP per capita (current US$)"
    description: "人均GDP，反映经济发展水平"

  - code: "NE_TRD_GNFS_ZS"
    name: "Trade (% of GDP)"
    description: "进出口总额占GDP比重，反映经济开放程度"

  - code: "NE_EXP_GNFS_ZS"
    name: "Exports of goods and services (% of GDP)"
    description: "出口占GDP比重"

  - code: "NE_IMP_GNFS_ZS"
    name: "Imports of goods and services (% of GDP)"
    description: "进口占GDP比重"

  - code: "BN_KLT_DINV_GD_ZS"
    name: "FDI net inflows (% of GDP)"
    description: "外国直接投资净流入占GDP比重"

  - code: "FP_CPI_TOTL_ZG"
    name: "Inflation consumer prices (annual %)"
    description: "CPI年变化率，反映通货膨胀水平"

  - code: "SL_UEM_TOTL_ZS"
    name: "Unemployment total (% of labor force)"
    description: "总失业率，反映劳动市场状况"

  - code: "SP_POP_TOTL"
    name: "Population total"
    description: "总人口"

  - code: "SP_URB_TOTL_IN_ZS"
    name: "Urban population (% of total)"
    description: "城镇化率，城镇人口占总人口比例"

  # ========== WTO 产品级贸易指标（按HS2聚合）==========
  # code 格式: WTO_{HS2}_{EXPORT|IMPORT}
  # 例如 WTO_72_EXPORT = HS72(钢铁)出口总额
  - code: "WTO_01_EXPORT"
    name: "HS01 Live animals export value"
    description: "HS01活动物出口总额（美元）"

  - code: "WTO_01_IMPORT"
