# 气候插件元数据
name: climate
version: 1.0.0
description: 读取气候数据（CSV），计算特定年份的气候影响度；依赖 map 与 time 模块。
author: AgentWorld Team
enabled: true

# 插件类信息
plugin_class: DefaultClimatePlugin
module: climate_plugin

# 实现的接口
interfaces:
  - IClimatePlugin
  - IClimate

# 依赖项
dependencies:
  - map
  - time

init_params:
  climate_data_path: experiment_dataset/climate_data/climate.csv

# 配置项
config:
  climate_zones: 5
  enable_extreme_events: true
