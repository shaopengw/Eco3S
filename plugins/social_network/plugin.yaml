# 社交网络插件元数据
name: social_network
version: 1.0.0
description: 基于小世界网络等模型为居民/智能体构建关系网络，支持信息、观点与影响的传播路径计算；需要先有人口或居民数据。
author: AgentWorld Team
enabled: true

# 插件类信息
plugin_class: DefaultSocialNetworkPlugin
module: social_network_plugin

# 实现的接口
interfaces:
  - ISocialNetworkPlugin
  - ISocialNetwork

# 依赖项
dependencies:
  - population


# 配置项
config:
  enable_community_detection: false
  enable_influence_propagation: true
