# 时间插件元数据
name: time
version: 1.0.0
description: 管理模拟的起始年份、总步长与当前时间，按步推进模拟年份并发布 time_advanced 事件。
author: AgentWorld Team
enabled: true

# 插件类信息
plugin_class: DefaultTimePlugin
module: time_plugin

# 实现的接口
interfaces:
  - ITimePlugin
  - ITime

# 依赖项
dependencies: []

# 配置项
config:
  enable_seasons: false
  enable_time_zones: false
