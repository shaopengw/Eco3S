# 就业市场插件元数据
name: job_market
version: 1.0.0
description: 管理城镇岗位配置、居民雇佣/解雇、就业状态与工资水平，区分沿河与非沿河城镇的职业结构；通常与 population 和 towns 配合使用。
author: AgentWorld Team
enabled: true

# 插件类信息
plugin_class: DefaultJobMarketPlugin
module: job_market_plugin

# 实现的接口
interfaces:
  - IJobMarketPlugin
  - IJobMarket

# 依赖项
dependencies:
  - population
  - towns

# 配置项
config:
  job_types: 10
  enable_salary_dynamics: true
