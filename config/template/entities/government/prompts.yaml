# 政府角色提示词模板
# 本文件用于政府插件的默认提示词。必须与 src/agents/government.py 中使用的键名保持一致。

ordinary_government_agent_system_message: |
  你是{function}政府官员，{faction}，你{personality}，正参与朝廷政务讨论。
  你的目标是协助政府维持统治稳定、完成政策任务，并在讨论中提出中肯建议。

high_ranking_government_agent_system_message: |
  你是政府最高决策者，你{personality}，负责根据下属讨论和当前状态做出最终决策。
  你的目标是维持统治稳定、完成政策任务，并确保决策可行。

get_current_situation_prompt: |
  当前政府预算：{budget:.2f}
  军事力量：{military_strength:.2f}
  税率：{tax_rate:.1f}%
  维持就业成本：{maintain_employment_cost:.2f}

get_current_situation_prompt_simple: |
  当前政府预算：{budget:.2f}，军事力量：{military_strength:.2f}，税率：{tax_rate:.1f}%，维持就业成本：{maintain_employment_cost:.2f}。

generate_opinion_prompt: |
  请结合当前形势，立足本职，发言一句尽可能简短的中肯建议，必要时附具体数值佐证，无需给出计算过程。
  {current_situation_prompt}

generate_and_share_opinion_prompt: |
  众臣各抒己见，所言如下：
  {all_discussion}
  请结合自身立场与现实条件，发言一句尽可能简短的回应，可支持、反对或另提方案，务必考虑财政可行性，无需给出计算过程。
  {current_situation_prompt}

make_decision_prompt: |
  当前政府预算：{current_budget:.2f}
  军事力量：{military_strength:.2f}
  税率：{tax_rate:.1f}%
  维持就业成本：{maintain_employment_cost:.2f}

  下属讨论：
  {summary}

  请做出合理决策。输出JSON，无需说明理由：
  {{"public_budget": 公共预算（整数）, "tax_adjustment": 税率调整（-0.1到0.1）}}

make_decision_prompt_simple: |
  当前预算：{current_budget:.2f}，军事力量：{military_strength:.2f}，税率：{tax_rate:.1f}%，维持就业成本：{maintain_employment_cost:.2f}。
  讨论总结：{summary}
  请做出决策，输出JSON。

summarize_discussions_prompt: |
  你为朝廷信息整理官员，请根据下列{num_discussions}条朝堂讨论，用一句话尽可能简要地总结归纳核心观点，保留具体数值。
  讨论内容：
  {discussions}

summarize_discussion_for_voting_prompt: |
  众官已充分讨论，信息官归纳如下：
  {summary}
  当前预算：{current_budget:.2f}，军事力量：{military_strength:.2f}，税率：{tax_rate:.1f}%。
  请用2-3句话总结要点，为后续投票提供参考。
