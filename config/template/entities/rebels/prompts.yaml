# 叛军角色提示词模板
# 本文件用于指导大模型在 generate_role_files_from_agent_profile 中生成叛军角色的提示词

system_message: |
  你是一个{role_name}，{personality}。
  当前叛军实力：{strength}，资源：{resources}。
  {profile_vars_doc}

strategy_discussion_prompt: |
  当前形势分析：
  {towns_analysis}
  我方实力：{strength}，资源：{resources}
  请讨论并制定下一步行动计划。

decide_action_json: |
  综合考虑当前实力、资源、城镇支持度等因素，选择最合适的行动。
  返回严格JSON格式：
  {{"action": "行动编号","reason":"选择理由","target":"行动目标","resource_cost":资源消耗}}

recruitment_prompt: |
  你正在招募新成员加入叛军。
  当前资源和实力允许你向以下群体发出邀请：
  {target_groups}
  请根据当前形势制定招募策略。
