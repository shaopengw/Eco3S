## influences.yaml 写作格式模板
## 顶层可选键：execution_order, influences
## 所有字符串区分大小写；建议只用小写+下划线。
## influence 唯一键："{source}->{target}:{name}"（重复会报错）。
## 注意：source 既可以是字符串，也可以是对象：
##   source: {module: <source_module>, inputs?: {...}, variables?: {...}}
## 加载时会把 source.module 作为真实 source 字符串，同时把 source.inputs/source.variables 合并进 params。
## 注意：此处 target 表示 apply_influences(target_name, ctx) 的 target_name（不是“目标模块名”）。
## 支持 type：constant | linear | code | expr | linear_multiplier | threshold | conditional
## 不支持从 YAML 加载：lambda。


## execution_order: List[Step]
## Step 允许两种等价写法：
## - {module: <module_name>, target: <target_name>}
## - [<module_name>, <target_name>]
execution_order:
  - module: map
    target: canal_decay
  - module: population
    target: birth_rate
  - module: government
    target: government_budget

## influences: List[Influence]
## Influence 必填键：type, source, target, name
## Influence 可选键：description, params
## Influence.params 由 type 决定：
## - constant.params: {target_attr: str, value: any}
## - linear.params: {variable: str, coefficient?: float=1.0, constant?: float=0.0, target_attr?: str|null, mode?: "set"|"add"|"multiply"="set"}
## - code.params: {code: str, target_attr?: str|null, result_var?: str="result", inputs?: Dict[str,InputSpec], variables?: Dict[str,any]}
## - expr.params: {expr: str, target_attr?: str|null, inputs?: Dict[str,InputSpec], result_key?: str|null, result_container?: str="result", context_updates?: Dict[str,str]}
## - linear_multiplier.params: {multiplier?: float=1.0, source_key?: str="value"}
## - threshold.params: {threshold: number, impact_value?: any=True, source_key?: str="value", compare_op?: "gt"|"gte"|"lt"|"lte"|"eq"="gt"}
## - conditional.params: {conditions: Dict[str, any], impact_value?: any=True}

## InputSpec（inputs 的值）支持两种写法：
## - "context.some_key" / "target.attr" / "module.attr"（module 指 context[module]）
## - {path: str, fallback_paths?: [str], default?: any, required?: bool=false, coerce?: "int"|"float"|"str"|"bool", value?: any}
influences:
  # === 具体示例===
  - name: climate_impact_to_navigability
    type: expr
    source:
      module: climate
      inputs:
        current_navigability:
          path: context.current_navigability
          fallback_paths:
            - target.navigability
          default: 0.8
          coerce: float
        climate_impact_factor:
          path: context.climate_impact_factor
          default: 0.0
          coerce: float
        natural_decay_rate:
          value: 0.1
    target: canal_decay
    description: 运河通航能力按默认公式自然衰减，并受气候影响
    params:
      expr: max(0, current_navigability * (1 - natural_decay_rate) - climate_impact_factor * 0.6)
      target_attr: navigability

  - name: gdp_tax_rate_to_budget
    type: expr
    source:
      module: economy
      inputs:
        gdp:
          path: context.gdp
          default: 0.0
          coerce: float
        tax_rate:
          path: context.tax_rate
          fallback_paths:
            - target.tax_rate
          default: 0.0
          coerce: float
        old_budget:
          path: target.budget
          default: 0.0
          coerce: float
    target: government_budget
    description: 政府预算每年增加税收收入（tax_income = gdp * tax_rate）
    params:
      expr: round(old_budget + gdp * tax_rate, 2)
      target_attr: budget
      context_updates:
        tax_income: gdp * tax_rate

  - name: job_market_to_military_strength
    type: code
    source: towns
    target: military_strength
    description: 军力 = 所有城镇“官员及士兵”已就业人数之和
    params:
      code: |
        towns_obj = context.get('towns')
        total = 0
        if towns_obj and hasattr(towns_obj, 'towns'):
            for _, town_data in towns_obj.towns.items():
                job_market = None
                if hasattr(town_data, 'get'):
                    job_market = town_data.get('job_market')
                else:
                    job_market = getattr(town_data, 'job_market', None)
                if not job_market:
                    continue
                jobs_info = getattr(job_market, 'jobs_info', {}) or {}
                bucket = jobs_info.get('官员及士兵') or {}
                employed = bucket.get('employed') or []
                total += len(employed)
        target.military_strength = int(total)
        context['military_strength'] = int(total)
        result = int(total)

  # === 其他类型示例（保留作模板，正式配置时请替换名称及字段） ===
  - name: example_constant
    type: constant
    source: any_source
    target: any_target
    params:
      target_attr: any_attr
      value: 0

  - name: example_linear
    type: linear
    source: any_source
    target: any_target
    params:
      variable: any.path
      coefficient: 1.0
      constant: 0.0
      target_attr: null
      mode: set

  - name: example_threshold
    type: threshold
    source: any_source
    target: any_target
    params:
      source_key: value
      threshold: 0
      compare_op: gt
      impact_value: true

  - name: example_conditional
    type: conditional
    source: any_source
    target: any_target
    params:
      conditions:
        module.attr: expected
      impact_value: true
